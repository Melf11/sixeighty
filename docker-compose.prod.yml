# Production stack für den Debian vServer: nur die App (keine Datenbank nötig,
# der Suchindex ist ins Image eingebacken).
# TLS/Routing übernimmt der zentrale Caddy-Proxy (Repo: web-caddy) über das
# externe Docker-Netz "proxy" (einmalig: docker network create proxy).
# Deployt von der GitHub-Actions-Pipeline (.github/workflows/deploy.yml).

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/melf11/sixeighty:latest}
    restart: unless-stopped
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      default:
      proxy:
        aliases: [sixeighty-app]

networks:
  proxy:
    external: true
